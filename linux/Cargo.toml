[package]
name = "rworldradio-linux"
version = "1.0.0"
edition = "2021"
# Set by the shared crate's dependency tree, not by this code - see ../shared/core.
rust-version = "1.88"
description = "Internet radio player - Linux (X11/Wayland) port of the Haiku R World Radio app"
license = "MIT"

[[bin]]
name = "rworldradio"
path = "src/main.rs"

[features]
default = ["x11"]
# X11, which is what XFCE runs. Build needs libx11 / libxkbcommon / libGL.
x11 = ["rworldradio/x11"]
# Native Wayland. Off by default because winit links libwayland-client at build
# time (it does not dlopen it), so this would add libwayland-dev to the build
# requirements of an X11-only desktop. Under a Wayland compositor the X11 build
# still runs fine via XWayland.
wayland = ["rworldradio/wayland"]

[dependencies]
# The whole implementation - dataset parsing, HTTP, HLS, the TS demuxer, the ADTS
# normalizer, decoding, audio output and the UI - lives in the shared crate. This
# crate is only the window setup.
rworldradio = { path = "../shared/core", default-features = false }
eframe = { version = "0.32", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
] }
egui = "0.32"

[profile.release]
opt-level = 3
lto = "thin"
